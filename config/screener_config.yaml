# Nifty 100 Screener — preset definitions (Sprint 3)
# Metrics map to the friendly columns produced by the screener engine.
# `exclude_financials_for` skips Financials-sector companies for that metric's filter.
# `treat_debt_free_as_pass` makes Debt Free (ICR = None) companies pass the filter.

presets:
  Quality_Compounder:
    label: "Quality Compounder"
    description: "High ROE, low leverage, positive cash flow, consistent revenue growth"
    filters:
      - metric: roe
        min: 15.0
      - metric: debt_to_equity
        max: 1.0
      - metric: free_cash_flow
        min: 0.0
      - metric: revenue_cagr_5y
        min: 10.0
    exclude_financials_for: [debt_to_equity]
    sort_by: composite_score
    sort_order: desc

  Value_Pick:
    label: "Value Pick"
    description: "Undervalued on earnings, book value, and yield with manageable debt"
    filters:
      - metric: pe_ratio
        max: 35.0
      - metric: pb_ratio
        max: 5.0
      - metric: debt_to_equity
        max: 2.0
      - metric: dividend_yield
        min: 1.0
    exclude_financials_for: [debt_to_equity]
    sort_by: composite_score
    sort_order: desc

  Growth_Accelerator:
    label: "Growth Accelerator"
    description: "High profit and revenue momentum with controlled leverage"
    filters:
      - metric: pat_cagr_5y
        min: 20.0
      - metric: revenue_cagr_5y
        min: 15.0
      - metric: debt_to_equity
        max: 2.0
    exclude_financials_for: [debt_to_equity]
    sort_by: composite_score
    sort_order: desc

  Dividend_Champion:
    label: "Dividend Champion"
    description: "Attractive yield, sustainable payout, and positive cash flow"
    filters:
      - metric: dividend_yield
        min: 2.0
      - metric: dividend_payout_ratio
        max: 80.0
      - metric: free_cash_flow
        min: 0.0
    sort_by: composite_score
    sort_order: desc

  Debt_Free_Blue_Chip:
    label: "Debt-Free Blue Chip"
    description: "Zero-debt balance sheet with high returns and large scale"
    filters:
      - metric: debt_to_equity
        max: 0.0
      - metric: roe
        min: 12.0
      - metric: sales
        min: 5000.0
    exclude_financials_for: [debt_to_equity]
    sort_by: composite_score
    sort_order: desc

  Turnaround_Watch:
    label: "Turnaround Watch"
    description: "Reviving revenue, positive cash flow, and deleveraging"
    filters:
      - metric: revenue_cagr_3y
        min: 10.0
      - metric: free_cash_flow
        min: 0.0
      - metric: de_declining
        operator: equals
        value: true
    sort_by: composite_score
    sort_order: desc
